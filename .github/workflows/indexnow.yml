name: IndexNow

# After each production deploy, tells IndexNow (Bing, Yandex, ...) about sitemap URLs that are new,
# whose <lastmod> changed, or that left the sitemap since the last run, and nothing else: repeatedly
# submitting unchanged URLs is what Bing flagged before. Each run keeps the sitemap's URL -> lastmod
# map as an artifact for the next run to diff against. With no earlier artifact (the first run, or
# none in 90 days) it only saves a baseline and submits nothing.
# Trigger: Vercel's "Vercel" commit status turning success on main (Vercel no longer creates GitHub
# deployments, so deployment_status never fires). Also runnable by hand. Needs no secrets.

on:
  status:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  indexnow:
    name: Submit new URLs to IndexNow
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.context == 'Vercel' && github.event.state == 'success' &&
       contains(github.event.branches.*.name, 'main'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download the last submitted URL list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow indexnow.yml --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name indexnow-urls --dir previous || echo "No artifact in run $run_id"
          fi

      - name: Let the new deploy take over the production domain
        if: github.event_name == 'status'
        run: sleep 60

      - name: Submit new, changed and removed URLs
        run: npm run indexnow -- --previous previous/urls.json --save urls.json

      - name: Keep the URL list for the next run
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: urls.json
          retention-days: 90
